name: ATLAS Research + GitHub Pages

on:
  # Best-effort schedule. GitHub may delay or skip scheduled runs under load.
  # Offset from minute 0 to reduce peak-time congestion.
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

concurrency:
  group: atlas-research-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ATLAS_RESEARCH_TOPICS: "trí tuệ nhân tạo mới nhất,công nghệ mới nhất,tin Việt Nam mới nhất"
  ATLAS_RESEARCH_SERVER: "duckduckgo-web-search"
  ATLAS_RESEARCH_RESULTS_PER_TOPIC: "3"
  ATLAS_RESEARCH_FETCH_TOP: "1"
  ATLAS_RESEARCH_MAX_ITEMS: "100"
  ATLAS_RESEARCH_OUTPUT: "site/atlas_research.json"
  ATLAS_MCP_CONFIG: "mcp-calculator-main/mcp_config.json"
  ATLAS_TOOL_TIMEOUT_SECONDS: "45"
  ATLAS_REMOTE_CACHE_TIMEOUT_SECONDS: "12"
  ATLAS_FETCH_MAX_LENGTH: "8000"

jobs:
  build:
    name: Research and build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "mcp-calculator-main/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r mcp-calculator-main/requirements.txt uv

      - name: Static Python syntax audit
        run: python -m py_compile research_worker.py

      - name: Run ATLAS Research Worker
        run: python research_worker.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy research cache to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
